# Статический CRT: без него .exe требует VCRUNTIME140.dll из распространяемого
# пакета Visual C++, а на свежей Windows его может не оказаться — человек качает
# «готовую сборку» и упирается в окно про отсутствующую библиотеку.
# Универсальный CRT (api-ms-win-crt-*) в Windows 10 и 11 входит, его тащить не надо.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
